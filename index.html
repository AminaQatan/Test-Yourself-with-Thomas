<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>اختبر نفسك مع توماس</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Tajawal', 'sans-serif'] },
                    colors: {
                        primary: '#0D9488', // Teal 600
                        secondary: '#F59E0B', // Amber 500
                        background: '#F0FDFA', // Teal 50
                    },
                    animation: {
                        'blob': 'blob 15s infinite ease-in-out',
                        'fade-in': 'fadeIn 0.5s ease-out forwards',
                        'pulse-subtle': 'pulseSubtle 2s infinite ease-in-out',
                    },
                    keyframes: {
                        blob: {
                            '0%, 100%': { transform: 'translate(0px, 0px) scale(1)' },
                            '33%': { transform: 'translate(30px, -50px) scale(1.1)' },
                            '66%': { transform: 'translate(-20px, 20px) scale(0.9)' },
                        },
                        fadeIn: {
                            '0%': { opacity: '0', transform: 'translateY(10px)' },
                            '100%': { opacity: '1', transform: 'translateY(0)' },
                        },
                        pulseSubtle: {
                            '0%, 100%': { transform: 'scale(1)', opacity: '1' },
                            '50%': { transform: 'scale(1.05)', opacity: '0.8' },
                        }
                    }
                }
            }
        }
    </script>
    <style>
        @media print {
            @page { margin: 0.5cm; size: A4; }
            body { background-color: white !important; -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }
            .no-print { display: none !important; }
            .print-break-inside-avoid { break-inside: avoid; page-break-inside: avoid; }
            #root { width: 100% !important; padding: 0 !important; }
        }
        .blob { position: fixed; width: 400px; height: 400px; filter: blur(80px); z-index: -1; opacity: 0.4; pointer-events: none; }
        .transition-all { transition: all 0.3s ease; }
        .answer-btn:active { transform: scale(0.98); }
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #0D9488; border-radius: 10px; }
    </style>
</head>
<body class="bg-background text-gray-800 font-sans min-h-screen flex flex-col overflow-x-hidden">
    <!-- Background Design Elements -->
    <div class="blob bg-primary/20 top-[-10%] right-[-10%] animate-blob"></div>
    <div class="blob bg-secondary/15 bottom-[-10%] left-[-10%] animate-blob" style="animation-delay: 2s;"></div>
    
    <header class="bg-white/80 backdrop-blur-md shadow-sm p-4 sticky top-0 z-50 no-print border-b border-teal-100">
        <div class="max-w-2xl mx-auto flex items-center justify-between">
            <h1 class="text-xl font-bold text-primary flex items-center gap-2">
                <span class="text-2xl">🧠</span> اختبر نفسك مع توماس
            </h1>
            <div class="flex items-center gap-2">
                <button id="muteBtn" class="p-2 rounded-full hover:bg-gray-100 transition-colors text-primary" title="كتم/تشغيل الصوت">
                    <svg id="unmutedIcon" class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.536 8.464a5 5 0 010 7.072m2.828-9.9a9 9 0 010 12.728M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z"></path></svg>
                    <svg id="mutedIcon" class="w-6 h-6 hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2"></path></svg>
                </button>
            </div>
        </div>
    </header>

    <main id="root" class="flex-grow container mx-auto px-4 py-8 flex flex-col items-center z-10 min-h-[70vh]">
        <!-- Dynamic Content Injected Here -->
    </main>

    <footer class="bg-white/80 backdrop-blur-sm py-8 border-t mt-auto no-print z-10 border-teal-100">
        <div class="container mx-auto px-4 text-center text-gray-500 text-sm space-y-2">
            <p class="font-bold text-gray-700">2026 | اختبر نفسك مع توماس</p>
            <p class="text-xs">صمم بواسطة: أ. أمينة قطن</p>
        </div>
    </footer>

    <script>
        // --- Questions & Categories Data ---
        const Category = {
            ATTENTION: 'الانتباه والتركيز',
            MEMORY: 'الذاكرة العاملة والقصيرة',
            LOGIC: 'التفكير المنطقي وحل المشكلات',
            SPEED: 'سرعة المعالجة واتخاذ القرار',
            FLEXIBILITY: 'المرونة الذهنية والتنظيم الذاتي'
        };

        const rawQuestions = [
            { text: "أستطيع الاستمرار في القراءة أو العمل حتى لو كان هناك ضجيج خفيف حولي.", category: Category.ATTENTION },
            { text: "عندما أتحدث مع شخص، أركز معه بالكامل ولا يسرح ذهني في أمور أخرى.", category: Category.ATTENTION },
            { text: "ألاحظ التفاصيل الصغيرة التي قد تفوت الآخرين في الصور أو النصوص.", category: Category.ATTENTION },
            { text: "أستطيع العودة لعملي بسرعة بعد مقاطعة مفاجئة دون أن أفقد تركيزي.", category: Category.ATTENTION },
            { text: "نادراً ما أفقد أغراضي الشخصية (مثل المفاتيح أو الهاتف).", category: Category.ATTENTION },
            { text: "أستطيع متابعة فيلم طويل أو محاضرة دون الشعور بالملل أو التشتت بسرعة.", category: Category.ATTENTION },
            { text: "أنجز المهام التي تتطلب دقة عالية دون ارتكاب أخطاء سهوة.", category: Category.ATTENTION },
            { text: "إذا أعطاني شخص رقم هاتف شفوياً، أستطيع تذكره حتى أكتبه.", category: Category.MEMORY },
            { text: "أتذكر قائمة المشتريات البسيطة (3-5 أغراض) دون كتابتها.", category: Category.MEMORY },
            { text: "عندما أدخل غرفة لجلب شيء ما، أتذكر فوراً ماذا كنت أريد.", category: Category.MEMORY },
            { text: "أستطيع تذكر تعليمات متعددة الخطوات وتنفيذها بالترتيب الصحيح.", category: Category.MEMORY },
            { text: "أتذكر أسماء الأشخاص الذين التقيت بهم حديثاً بسهولة.", category: Category.MEMORY },
            { text: "يمكنني إجراء عمليات حسابية بسيطة في ذهني دون ورقة وقلم.", category: Category.MEMORY },
            { text: "أتذكر مواعيد مهامي اليومية دون الحاجة للنظر في التقويم باستمرار.", category: Category.MEMORY },
            { text: "عندما أواجه مشكلة تقنية، أحاول فهم السبب الجذري قبل طلب المساعدة.", category: Category.LOGIC },
            { text: "أستطيع ربط المعلومات ببعضها لاستنتاج حلول جديدة.", category: Category.LOGIC },
            { text: "أحب ألعاب الألغاز والكلمات المتقاطعة أو الشطرنج.", category: Category.LOGIC },
            { text: "عندما يجادلني شخص، أستطيع اكتشاف التناقضات في كلامه بسهولة.", category: Category.LOGIC },
            { text: "أخطط لخطواتي القادمة قبل البدء في أي مشروع جديد.", category: Category.LOGIC },
            { text: "أستطيع شرح الأفكار المعقدة للآخرين بطريقة مبسطة.", category: Category.LOGIC },
            { text: "أوازن بين الإيجابيات والسلبيات قبل اتخاذ قرارات مصيرية.", category: Category.LOGIC },
            { text: "أفهم النكات أو التلميحات بسرعة في المحادثات.", category: Category.SPEED },
            { text: "أستطيع اتخاذ قرار سريع في المطعم أو عند الشراء دون تردد طويل.", category: Category.SPEED },
            { text: "عندما يسألني أحد سؤالاً مفاجئاً، تكون إجابتي حاضرة وسريعة.", category: Category.SPEED },
            { text: "أنجز المهام الروتينية بسرعة مقارنة بزملائي أو من حولي.", category: Category.SPEED },
            { text: "أستوعب المعلومات الجديدة في العمل أو الدراسة بسرعة.", category: Category.SPEED },
            { text: "ردة فعلي سريعة عند حدوث شيء غير متوقع (مثلاً سقوط شيء).", category: Category.SPEED },
            { text: "أقرأ النصوص والرسائل بسرعة مع فهم محتواها.", category: Category.SPEED },
            { text: "إذا تغيرت الخطة فجأة، أستطيع التكيف مع الوضع الجديد دون توتر.", category: Category.FLEXIBILITY },
            { text: "أتقبل وجهات النظر المختلفة حتى لو كانت تخالف رأيي.", category: Category.FLEXIBILITY },
            { text: "أستطيع الانتقال من مهمة إلى أخرى بسلاسة.", category: Category.FLEXIBILITY },
            { text: "أسيطر على انفعالاتي ولا أغضب بسهولة عند حدوث أخطاء.", category: Category.FLEXIBILITY },
            { text: "أعترف بخطئي إذا اكتشفت أنني كنت على غير صواب.", category: Category.FLEXIBILITY },
            { text: "أستطيع تغيير طريقتي في العمل إذا وجدت طريقة أفضل.", category: Category.FLEXIBILITY },
            { text: "أرتب أولوياتي بوضوح عندما تتراكم علي الأعمال.", category: Category.FLEXIBILITY },
            { text: "أتعافى نفسياً بسرعة بعد يوم سيء أو موقف محبط.", category: Category.FLEXIBILITY },
        ];

        // --- Application State ---
        let state = {
            step: 'welcome',
            userInfo: JSON.parse(localStorage.getItem('thomas_quiz_user')) || { fullName: '', phone: '', isStudent: false },
            mode: 'قياسي',
            reportType: 'مفصّل',
            questions: [],
            currentQIndex: 0,
            answers: [],
            isMuted: false,
            results: null,
            showPlan: false,
            isAdmin: new URLSearchParams(window.location.search).get('admin') === 'true'
        };

        // --- Core Functions ---
        const playSound = (type) => {
            if (state.isMuted) return;
            const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            const gain = audioCtx.createGain();
            gain.connect(audioCtx.destination);
            gain.gain.setValueAtTime(0.05, audioCtx.currentTime);

            const osc = audioCtx.createOscillator();
            if (type === 'click') {
                osc.frequency.setValueAtTime(440, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
                osc.start(); osc.stop(audioCtx.currentTime + 0.1);
            } else if (type === 'success') {
                [523, 659, 783, 1046].forEach((f, i) => {
                    const o = audioCtx.createOscillator();
                    o.frequency.setValueAtTime(f, audioCtx.currentTime + i * 0.1);
                    const g = audioCtx.createGain();
                    g.gain.setValueAtTime(0.05, audioCtx.currentTime + i * 0.1);
                    o.connect(g); g.connect(audioCtx.destination);
                    o.start(audioCtx.currentTime + i * 0.1); o.stop(audioCtx.currentTime + i * 0.1 + 0.2);
                });
            }
            osc.connect(gain);
        };

        const calculateResults = () => {
            const categories = Object.values(Category);
            const categoryScores = [];
            let totalSum = 0;
            let count = 0;

            categories.forEach(cat => {
                const catAns = state.answers.filter(a => a.category === cat);
                if (catAns.length === 0) return;
                const sum = catAns.reduce((acc, curr) => acc + curr.score, 0);
                const score = Math.round((sum / (catAns.length * 5)) * 100);
                let level = score >= 80 ? 'ممتاز' : score >= 60 ? 'جيد' : score >= 40 ? 'متوسط' : 'منخفض';
                categoryScores.push({ category: cat, score, level });
                totalSum += score;
                count++;
            });

            const averageScore = Math.round(totalSum / count);
            let overallLevel = averageScore >= 80 ? 'ممتاز' : averageScore >= 60 ? 'جيد' : averageScore >= 40 ? 'متوسط' : 'منخفض';

            const sorted = [...categoryScores].sort((a, b) => b.score - a.score);
            const strengths = sorted.slice(0, 3).filter(s => s.score >= 60).map(s => `تتميز بأداء رائع في **${s.category}**.`);
            const improvements = [...sorted].reverse().slice(0, 3).filter(s => s.score < 60).map(s => `هناك فرصة جيدة لتنمية **${s.category}**.`);
            
            if (strengths.length === 0) strengths.push("لديك إمكانات كبيرة تنتظر التوظيف الأمثل.");
            if (improvements.length === 0) improvements.push("حافظ على هذا التوازن الممتاز في قدراتك.");

            const lowest = sorted[sorted.length - 1].category;
            const plan = [
                `يوم 1: ابدأ بملاحظة العوامل التي تشتت ذهنك في ${lowest}.`,
                "يوم 2: نظم وقت نومك ليكون 8 ساعات يومياً لراحة دماغك.",
                "يوم 3: جرب تمرين 'العد التنازلي' من 100 لزيادة التركيز.",
                "يوم 4: تناول وجبات غنية بالفوسفور والأوميغا 3 والمكسرات.",
                "يوم 5: خصص 20 دقيقة للقراءة المركزة بعيداً عن هاتفك.",
                "يوم 6: مارس لعبة ذهنية كالسودوكو أو الشطرنج لمدة ساعة.",
                "يوم 7: راجع تقدمك وكافئ نفسك على التزامك بالخطة."
            ];

            return { categoryScores, averageScore, overallLevel, strengths, improvements, plan };
        };

        // --- View Rendering ---
        const render = () => {
            const root = document.getElementById('root');
            root.innerHTML = '';
            window.scrollTo({ top: 0, behavior: 'smooth' });

            switch(state.step) {
                case 'welcome': renderWelcome(root); break;
                case 'registration': renderRegistration(root); break;
                case 'mode': renderMode(root); break;
                case 'report_type': renderReportType(root); break;
                case 'quiz': renderQuiz(root); break;
                case 'results': renderResults(root); break;
            }
        };

        const renderWelcome = (root) => {
            root.innerHTML = `
                <div class="text-center space-y-10 animate-fade-in max-w-md w-full px-4">
                    <div class="relative inline-block">
                        <div class="w-32 h-32 bg-primary rounded-full flex items-center justify-center border-4 border-white shadow-2xl mx-auto animate-pulse-subtle">
                            <span class="text-6xl">🧐</span>
                        </div>
                        <div class="absolute -bottom-2 -right-2 bg-secondary text-white p-2 rounded-full shadow-lg">✨</div>
                    </div>
                    <div class="space-y-4">
                        <h2 class="text-4xl font-extrabold text-gray-800">اختبر نفسك مع توماس</h2>
                        <div class="bg-white/60 p-6 rounded-3xl shadow-sm border border-teal-50">
                            <p class="text-teal-800 font-bold mb-2">هدف التطبيق:</p>
                            <p class="text-gray-600 leading-relaxed">يهدف هذا التطبيق إلى تقييم المهارات الذهنية الأساسية وتوفير خطة تطوير شخصية لمساعدتك في رفع كفاءة أدائك العقلي في الدراسة والعمل.</p>
                        </div>
                    </div>
                    <button onclick="navigate('registration')" class="w-full bg-primary text-white font-bold py-5 px-8 rounded-[2rem] shadow-xl hover:bg-teal-700 active:scale-95 transition-all text-xl ring-offset-2 hover:ring-2 ring-primary">ابدأ الرحلة 🚀</button>
                </div>
            `;
        };

        const renderRegistration = (root) => {
            root.innerHTML = `
                <div class="w-full max-w-md bg-white p-8 rounded-[2.5rem] shadow-2xl border-t-8 border-primary animate-fade-in">
                    <h2 class="text-2xl font-bold text-primary text-center mb-8">من أنت أيها الذكي؟ 📝</h2>
                    <form id="regForm" onsubmit="handleRegistration(event)" class="space-y-6">
                        <div class="space-y-1">
                            <label class="block text-sm font-bold text-gray-600 mr-2">الاسم بالكامل</label>
                            <input id="fullName" type="text" required class="w-full p-4 bg-gray-50 border border-gray-200 rounded-2xl outline-none focus:ring-2 focus:ring-primary focus:bg-white transition-all text-right" placeholder="أدخل اسمك هنا" value="${state.userInfo.fullName}">
                        </div>
                        <div class="space-y-1">
                            <label class="block text-sm font-bold text-gray-600 mr-2">رقم الهاتف</label>
                            <input id="phone" type="tel" required class="w-full p-4 bg-gray-50 border border-gray-200 rounded-2xl outline-none focus:ring-2 focus:ring-primary focus:bg-white transition-all text-right" placeholder="9xxxxxxx" value="${state.userInfo.phone}">
                        </div>
                        <div class="bg-teal-50/50 p-5 rounded-2xl border border-teal-100">
                            <label class="block text-sm font-bold text-teal-800 mb-3">هل أنت طالب بالكلية المهنية؟</label>
                            <div class="flex gap-8">
                                <label class="flex items-center gap-3 cursor-pointer group">
                                    <input type="radio" name="isStudent" value="true" ${state.userInfo.isStudent ? 'checked' : ''} class="w-5 h-5 accent-primary"> 
                                    <span class="font-medium group-hover:text-primary transition-colors">نعم</span>
                                </label>
                                <label class="flex items-center gap-3 cursor-pointer group">
                                    <input type="radio" name="isStudent" value="false" ${!state.userInfo.isStudent ? 'checked' : ''} class="w-5 h-5 accent-primary"> 
                                    <span class="font-medium group-hover:text-primary transition-colors">لا</span>
                                </label>
                            </div>
                        </div>
                        <button type="submit" class="w-full bg-primary text-white font-bold py-4 rounded-2xl shadow-md hover:bg-teal-700 active:scale-95 transition-all text-lg">استمرار ➡️</button>
                    </form>
                </div>
            `;
        };

        const renderMode = (root) => {
            root.innerHTML = `
                <div class="text-center space-y-10 animate-fade-in max-w-md w-full">
                    <h2 class="text-3xl font-black text-gray-800">أهلاً بك يا ${state.userInfo.fullName.split(' ')[0]}! ✨</h2>
                    <p class="text-gray-500 font-medium">اختر النمط الذي يناسبك للاختبار:</p>
                    <div class="grid gap-4">
                        <button onclick="startQuiz('سريع')" class="w-full bg-white border-2 border-primary/20 text-primary font-bold py-6 rounded-3xl shadow-sm hover:border-primary hover:bg-teal-50 active:scale-95 transition-all flex items-center justify-between px-8">
                            <div class="text-right">
                                <div class="text-lg">سريع</div>
                                <div class="text-xs font-normal text-gray-400">12 سؤال فقط</div>
                            </div>
                            <span class="text-3xl">🏎️</span>
                        </button>
                        <button onclick="startQuiz('قياسي')" class="w-full bg-primary text-white font-bold py-6 rounded-3xl shadow-xl hover:bg-teal-700 active:scale-95 transition-all flex items-center justify-between px-8 ring-offset-4 hover:ring-2 ring-primary">
                             <div class="text-right">
                                <div class="text-lg">قياسي</div>
                                <div class="text-xs font-normal text-teal-100">24 سؤال (شامل)</div>
                            </div>
                            <span class="text-3xl">📏</span>
                        </button>
                        <button onclick="startQuiz('موسّع')" class="w-full bg-white border-2 border-primary/20 text-primary font-bold py-6 rounded-3xl shadow-sm hover:border-primary hover:bg-teal-50 active:scale-95 transition-all flex items-center justify-between px-8">
                             <div class="text-right">
                                <div class="text-lg">موسّع</div>
                                <div class="text-xs font-normal text-gray-400">36 سؤال (دقيق جداً)</div>
                            </div>
                            <span class="text-3xl">🧠</span>
                        </button>
                    </div>
                </div>
            `;
        };

        const renderReportType = (root) => {
            root.innerHTML = `
                <div class="text-center space-y-10 animate-fade-in max-w-md w-full">
                    <div class="w-24 h-24 bg-secondary/10 rounded-full flex items-center justify-center mx-auto shadow-inner border border-secondary/20"><span class="text-5xl">📊</span></div>
                    <h2 class="text-2xl font-bold text-gray-800">كيف ننتج تقريرك؟</h2>
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                        <button onclick="setReportType('مختصر')" class="bg-white border-2 border-gray-100 text-gray-600 font-bold py-6 rounded-3xl hover:border-primary hover:text-primary transition-all shadow-sm">ملخص النتيجة</button>
                        <button onclick="setReportType('مفصّل')" class="bg-primary text-white font-bold py-6 rounded-3xl hover:bg-teal-700 transition-all shadow-lg">تحليل تفصيلي</button>
                    </div>
                </div>
            `;
        };

        const renderQuiz = (root) => {
            const q = state.questions[state.currentQIndex];
            const progress = Math.round(((state.currentQIndex + 1) / state.questions.length) * 100);
            
            root.innerHTML = `
                <div class="w-full max-w-xl animate-fade-in px-2">
                    <div class="flex justify-between items-center mb-6 no-print">
                        <div class="text-sm font-bold text-teal-600 bg-teal-50 px-3 py-1 rounded-lg">السؤال ${state.currentQIndex + 1} من ${state.questions.length}</div>
                        <button onclick="navigate('welcome')" class="text-xs font-bold text-red-400 hover:text-red-600 hover:underline">إلغاء الاختبار</button>
                    </div>
                    
                    <div class="w-full bg-gray-200 h-3 rounded-full mb-10 overflow-hidden shadow-inner p-[2px]">
                        <div class="bg-gradient-to-l from-secondary to-amber-400 h-full rounded-full transition-all duration-500 shadow-sm" style="width: ${progress}%"></div>
                    </div>

                    <div class="bg-white p-12 rounded-[3rem] shadow-2xl border-b-[10px] border-primary text-center mb-10 min-h-[220px] flex items-center justify-center relative group">
                        <div class="absolute -top-4 right-10 bg-primary text-white text-[11px] font-bold px-4 py-1.5 rounded-full shadow-lg transition-transform group-hover:scale-105">${q.category}</div>
                        <h3 class="text-3xl font-bold text-gray-800 leading-snug">"${q.text}"</h3>
                    </div>

                    <div class="grid gap-4">
                        ${[
                            { score: 5, label: "ينطبق تماماً", emoji: "🤩", color: "hover:bg-green-50" },
                            { score: 4, label: "ينطبق غالباً", emoji: "🙂", color: "hover:bg-blue-50" },
                            { score: 3, label: "أحياناً", emoji: "😐", color: "hover:bg-gray-50" },
                            { score: 2, label: "نادراً", emoji: "😕", color: "hover:bg-orange-50" },
                            { score: 1, label: "لا ينطبق", emoji: "🙅‍♂️", color: "hover:bg-red-50" }
                        ].map(opt => `
                            <button onclick="handleAnswer(${opt.score})" class="answer-btn flex items-center justify-between p-5 bg-white border border-gray-100 rounded-[1.5rem] ${opt.color} hover:border-primary/40 transition-all group shadow-sm">
                                <span class="text-4xl group-hover:scale-110 transition-transform">${opt.emoji}</span>
                                <span class="font-bold text-gray-700 text-xl">${opt.label}</span>
                            </button>
                        `).join('')}
                    </div>
                </div>
            `;
        };

        const renderResults = (root) => {
            const res = state.results;
            root.innerHTML = `
                <div class="w-full max-w-3xl space-y-10 animate-fade-in pb-20 px-2">
                    <div class="text-center space-y-4">
                        <div class="text-6xl animate-bounce">🏆</div>
                        <h2 class="text-4xl font-black text-gray-800">نتائج قدراتك الذهنية</h2>
                        <div class="text-primary font-bold text-2xl">${state.userInfo.fullName}</div>
                        <div class="inline-flex gap-3 text-xs bg-gray-100 px-4 py-2 rounded-full font-bold text-gray-500">
                            <span>الهاتف: ${state.userInfo.phone}</span>
                            <span class="w-px h-4 bg-gray-300"></span>
                            <span>الفئة: ${state.userInfo.isStudent ? 'طالب مهني' : 'ضيف'}</span>
                        </div>
                    </div>

                    <!-- Main Score Card -->
                    <div class="bg-gradient-to-br from-teal-500 to-teal-800 text-white p-10 rounded-[4rem] shadow-2xl text-center relative overflow-hidden print-break-inside-avoid ring-8 ring-white/50">
                        <div class="relative z-10 space-y-2">
                            <div class="text-sm uppercase tracking-[0.2em] font-bold opacity-80">مؤشر الكفاءة الذهنية</div>
                            <div class="text-8xl font-black drop-shadow-lg">${res.averageScore}%</div>
                            <div class="inline-block bg-white text-primary px-8 py-2 rounded-full font-black mt-6 shadow-xl">المستوى: ${res.overallLevel}</div>
                        </div>
                        <div class="absolute -right-16 -bottom-16 w-60 h-60 bg-white/10 rounded-full blur-3xl"></div>
                        <div class="absolute -left-10 -top-10 w-40 h-40 bg-secondary/20 rounded-full blur-2xl"></div>
                    </div>

                    ${state.reportType === 'مفصّل' ? `
                        <div class="grid grid-cols-1 lg:grid-cols-2 gap-8 items-stretch">
                            <div class="bg-white p-8 rounded-[3rem] shadow-xl border border-gray-50 print-break-inside-avoid flex flex-col justify-center">
                                <h3 class="font-black text-gray-700 mb-8 text-center text-xl">خريطة القدرات</h3>
                                <canvas id="scoreChart" class="w-full"></canvas>
                            </div>
                            <div class="space-y-6">
                                <div class="bg-white p-8 rounded-[2.5rem] shadow-lg border-r-[10px] border-green-500 print-break-inside-avoid">
                                    <h4 class="font-black text-green-700 mb-4 flex items-center gap-3 text-lg">
                                        <span class="bg-green-100 p-2 rounded-xl">💪</span> نقاط القوة
                                    </h4>
                                    <ul class="text-sm space-y-4 text-gray-700">
                                        ${res.strengths.map(s => `<li class="flex items-start gap-3"><span class="text-green-500 mt-1 font-bold text-lg">•</span>${s.replace(/\*\*(.*?)\*\*/g, '<b class="text-green-800">$1</b>')}</li>`).join('')}
                                    </ul>
                                </div>
                                <div class="bg-white p-8 rounded-[2.5rem] shadow-lg border-r-[10px] border-amber-500 print-break-inside-avoid">
                                    <h4 class="font-black text-amber-700 mb-4 flex items-center gap-3 text-lg">
                                        <span class="bg-amber-100 p-2 rounded-xl">🌱</span> مسارات التطوير
                                    </h4>
                                    <ul class="text-sm space-y-4 text-gray-700">
                                        ${res.improvements.map(s => `<li class="flex items-start gap-3"><span class="text-amber-500 mt-1 font-bold text-lg">•</span>${s.replace(/\*\*(.*?)\*\*/g, '<b class="text-amber-800">$1</b>')}</li>`).join('')}
                                    </ul>
                                </div>
                            </div>
                        </div>
                    ` : ''}

                    <!-- 7 Day Training Plan -->
                    <div class="bg-white p-10 rounded-[3.5rem] shadow-2xl border-t-8 border-secondary print-break-inside-avoid">
                        <div class="flex flex-col sm:flex-row items-center justify-between mb-8 gap-4">
                            <h3 class="text-2xl font-black text-gray-800 flex items-center gap-3">
                                <span class="text-3xl">📅</span> خطة التدريب (7 أيام)
                            </h3>
                            <button onclick="togglePlan()" class="bg-secondary/10 text-secondary px-6 py-2 rounded-full font-black hover:bg-secondary hover:text-white transition-all no-print">
                                ${state.showPlan ? 'إخفاء الخطة' : 'إظهار التفاصيل'}
                            </button>
                        </div>
                        ${state.showPlan ? `
                            <div class="grid gap-4">
                                ${res.plan.map((day, i) => `
                                    <div class="flex items-center gap-5 p-5 bg-amber-50/30 rounded-3xl hover:bg-secondary/5 transition-all border-r-4 border-secondary/20 group">
                                        <div class="w-10 h-10 bg-secondary text-white rounded-2xl flex items-center justify-center font-black text-sm flex-shrink-0 group-hover:rotate-12 transition-transform">${i+1}</div>
                                        <div class="text-base text-gray-700 font-semibold leading-relaxed">${day}</div>
                                    </div>
                                `).join('')}
                            </div>
                        ` : `
                            <div class="text-center py-8 px-4 border-2 border-dashed border-gray-100 rounded-[2rem] text-gray-400">
                                <p class="mb-2 italic">لقد أعددنا لك خطة تدريبية مخصصة بناءً على نقاط ضعفك.</p>
                                <p class="text-sm font-bold">اضغط على الزر أعلاه لعرض الخطة.</p>
                            </div>
                        `}
                    </div>

                    <!-- Actions Panel -->
                    <div class="bg-white p-10 rounded-[3rem] shadow-2xl space-y-8 text-center no-print">
                        <h3 class="font-black text-gray-700 text-xl">تواصل واحفظ نتائجك ✨</h3>
                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                            <button onclick="sendEmail()" class="bg-primary text-white font-black py-5 rounded-3xl shadow-xl hover:bg-teal-700 transition-all flex items-center justify-center gap-3 ring-offset-4 hover:ring-2 ring-primary">
                                <span class="text-2xl">📧</span>
                                <span>إرسال للمعلمة</span>
                            </button>
                            <button onclick="handlePrint()" class="bg-white border-2 border-primary text-primary font-black py-5 rounded-3xl shadow hover:bg-teal-50 transition-all flex items-center justify-center gap-3">
                                <span class="text-2xl">📄</span>
                                <span>تحميل PDF</span>
                            </button>
                        </div>
                        <div class="flex flex-wrap justify-center gap-4 pt-4 border-t border-gray-50">
                            <button onclick="share('whatsapp')" class="bg-[#25D366] text-white px-8 py-3 rounded-full font-black text-sm hover:scale-105 transition-transform shadow-md">واتساب</button>
                            <button onclick="share('twitter')" class="bg-black text-white px-8 py-3 rounded-full font-black text-sm hover:scale-105 transition-transform shadow-md">X (تويتر)</button>
                        </div>
                    </div>

                    ${state.isAdmin ? `
                        <div class="bg-amber-50 p-8 rounded-[3rem] border-2 border-dashed border-amber-200 text-center space-y-5 no-print">
                            <h3 class="font-black text-amber-800 text-lg flex items-center justify-center gap-2"><span>🔐</span> أدوات المعلمة</h3>
                            <button onclick="exportCSV()" class="bg-amber-500 text-white px-10 py-4 rounded-2xl font-black shadow-lg hover:bg-amber-600 transition-all">تصدير قاعدة البيانات (Excel)</button>
                        </div>
                    ` : ''}

                    <div class="pt-10 no-print flex justify-center">
                        <button onclick="restart()" class="text-red-400 font-bold hover:text-red-600 transition-all flex items-center gap-2 px-10 py-4 rounded-2xl hover:bg-red-50">
                            <span>🔄</span>
                            إعادة الاختبار من البداية
                        </button>
                    </div>
                </div>
            `;
            if (state.reportType === 'مفصّل') setTimeout(() => initChart(res.categoryScores), 100);
        };

        // --- Logic Handlers ---
        window.navigate = (step) => { 
            playSound('click'); 
            state.step = step; 
            render(); 
        };

        window.handleRegistration = (e) => {
            e.preventDefault();
            const fullName = document.getElementById('fullName').value;
            const phone = document.getElementById('phone').value;
            const isStudent = document.querySelector('input[name="isStudent"]:checked').value === 'true';
            
            state.userInfo = { fullName, phone, isStudent };
            localStorage.setItem('thomas_quiz_user', JSON.stringify(state.userInfo));
            navigate('mode');
        };

        window.startQuiz = (mode) => {
            state.mode = mode;
            let count = mode === 'سريع' ? 12 : mode === 'موسّع' ? 36 : 24;
            
            const grouped = {};
            Object.values(Category).forEach(c => grouped[c] = rawQuestions.filter(q => q.category === c));
            
            state.questions = [];
            let added = 0; let round = 0;
            const cats = Object.values(Category);
            while (added < count) {
                for (let c of cats) {
                    if (added >= count) break;
                    if (grouped[c][round]) {
                        state.questions.push(grouped[c][round]);
                        added++;
                    }
                }
                round++;
            }
            navigate('report_type');
        };

        window.setReportType = (type) => {
            state.reportType = type;
            state.currentQIndex = 0;
            state.answers = [];
            navigate('quiz');
        };

        window.handleAnswer = (score) => {
            playSound('click');
            state.answers.push({ score, category: state.questions[state.currentQIndex].category });
            
            if (state.currentQIndex < state.questions.length - 1) {
                state.currentQIndex++;
                render();
            } else {
                playSound('success');
                state.results = calculateResults();
                state.step = 'results';
                render();
            }
        };

        window.togglePlan = () => {
            state.showPlan = !state.showPlan;
            render();
        };

        window.restart = () => {
            state.answers = [];
            state.currentQIndex = 0;
            state.results = null;
            state.showPlan = false;
            navigate('welcome');
        };

        window.handlePrint = () => {
            state.showPlan = true;
            render();
            setTimeout(() => window.print(), 500);
        };

        window.sendEmail = () => {
            const r = state.results;
            const email = "amina.qatan@svc.edu.om";
            const subject = encodeURIComponent(`نتائج اختبار توماس: ${state.userInfo.fullName}`);
            const body = encodeURIComponent(`مرحباً أ. أمينة، هذه هي نتائج اختباري في "اختبر نفسك مع توماس":
            
اسم المتسابق: ${state.userInfo.fullName}
رقم الهاتف: ${state.userInfo.phone}
الدرجة الكلية: ${r.averageScore}/100
المستوى العام: ${r.overallLevel}

تفاصيل القدرات الذهنية:
${r.categoryScores.map(s => `- ${s.category}: ${s.score}% (${s.level})`).join('\n')}

تحياتي،
${state.userInfo.fullName}`);
            window.location.href = `mailto:${email}?subject=${subject}&body=${body}`;
        };

        window.share = (p) => {
            const text = encodeURIComponent(`حققت ${state.results.averageScore}/100 في اختبار توماس للقدرات الذهنية! 🧠 اختبر نفسك الآن.`);
            const url = encodeURIComponent(window.location.href);
            window.open(p === 'whatsapp' ? `https://wa.me/?text=${text}%20${url}` : `https://twitter.com/intent/tweet?text=${text}&url=${url}`);
        };

        window.exportCSV = () => {
            const r = state.results;
            const headers = ['الاسم', 'الهاتف', 'طالب بالكلية', 'الدرجة الكلية', 'المستوى', ...r.categoryScores.map(s => s.category)];
            const row = [state.userInfo.fullName, state.userInfo.phone, state.userInfo.isStudent ? 'نعم' : 'لا', r.averageScore, r.overallLevel, ...r.categoryScores.map(s => s.score)];
            const csv = "\uFEFF" + headers.join(',') + "\n" + row.join(',');
            const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement("a");
            link.href = URL.createObjectURL(blob);
            link.download = `نتائج_توماس_${state.userInfo.fullName}.csv`;
            link.click();
        };

        const initChart = (scores) => {
            const ctx = document.getElementById('scoreChart');
            if (!ctx) return;
            
            const labels = scores.map(s => s.category.split(' ')[0]);

            new Chart(ctx, {
                type: 'radar',
                data: {
                    labels: labels,
                    datasets: [{
                        label: 'القدرات الذهنية',
                        data: scores.map(s => s.score),
                        fill: true,
                        backgroundColor: 'rgba(13, 148, 136, 0.25)',
                        borderColor: '#0D9488',
                        borderWidth: 3,
                        pointBackgroundColor: '#0D9488',
                        pointBorderColor: '#fff',
                        pointRadius: 4,
                        pointHoverBackgroundColor: '#fff',
                        pointHoverBorderColor: '#0D9488'
                    }]
                },
                options: {
                    scales: {
                        r: {
                            min: 0,
                            max: 100,
                            ticks: { display: false, stepSize: 20 },
                            angleLines: { color: 'rgba(0,0,0,0.05)' },
                            grid: { color: 'rgba(0,0,0,0.05)' },
                            pointLabels: { 
                                font: { size: 14, family: 'Tajawal', weight: 'bold' }, 
                                color: '#0D9488' 
                            }
                        }
                    },
                    plugins: { 
                        legend: { display: false },
                        tooltip: {
                            backgroundColor: '#0D9488',
                            titleFont: { family: 'Tajawal' },
                            bodyFont: { family: 'Tajawal' }
                        }
                    }
                }
            });
        };

        // --- Setup Audio ---
        document.getElementById('muteBtn').onclick = () => {
            state.isMuted = !state.isMuted;
            document.getElementById('mutedIcon').classList.toggle('hidden', !state.isMuted);
            document.getElementById('unmutedIcon').classList.toggle('hidden', state.isMuted);
        };

        // --- Bootstrap App ---
        render();
    </script>
</body>
</html>
